name: Mirror to GitLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract GitLab host (without port)
        id: gitlab_host
        run: echo "host=${GITLAB_HOST%%:*}" >> "$GITHUB_OUTPUT"
        env:
          GITLAB_HOST: ${{ vars.GITLAB_HOST }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          ping: ${{ steps.gitlab_host.outputs.host }}

      - name: Push to GitLab
        run: |
          git push --force "http://${{ secrets.GITLAB_DEPLOY_USER }}:${{ secrets.GITLAB_DEPLOY_TOKEN }}@${{ vars.GITLAB_HOST }}/${{ vars.GITLAB_PROJECT_PATH }}" HEAD:main