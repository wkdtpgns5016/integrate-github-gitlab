stages:
  - test
  - build
  - deploy

.rules: &main_only
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

check-testfile:
  stage: test
  image: alpine:latest
  <<: *main_only
  script:
    - test -f testfile
    - cat testfile

update-tag:
  stage: build
  image: alpine:latest
  <<: *main_only
  script:
    - sed -i "s/^tag:.*/tag:${CI_COMMIT_SHORT_SHA}/" testfile
    - cat testfile
  artifacts:
    paths:
      - testfile
    expire_in: 1 hour

push-tag:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  before_script:
    - apk add --no-cache git
    - git config user.name "gitlab-ci"
    - git config user.email "gitlab-ci@local"
  script:
    # update-tag 스테이지의 artifact(testfile)가 checkout 위에 덮어써진 상태로 시작한다.
    - git add testfile
    # 변경사항이 없으면(=이미 같은 값) commit이 실패하므로 무시하고 넘어간다.
    - 'git commit -m "ci: update tag to ${CI_COMMIT_SHORT_SHA} [skip ci]" || echo "변경사항 없음, 커밋 건너뜀"'
    # CI_JOB_TOKEN(기본 origin 인증)은 push에 못 쓰고, 애초에 여긴 GitLab이 아니라
    # GitHub 로 되돌려 push하는 것이라 GITHUB_PUSH_TOKEN(=GITHUB_PAT)으로 인증한다.
    # main 이 아니라 test 브랜치로 보낸다 — mirror-to-gitlab.yml 은 main push 에만 반응하므로
    # 이 push 는 애초에 그 워크플로를 트리거하지 않는다 (무한루프 걱정 없음, [skip ci] 는 이중 안전장치).
    # --force: 이 파이프라인은 매번 GitLab main의 최신 지점에서 새로 커밋을 만들어 붙이므로,
    # 반복 실행하면 test 브랜치의 이전 커밋과 조상 관계가 어긋나 일반 push는 non-fast-forward로 거절된다.
    - git push --force "https://x-access-token:${GITHUB_PUSH_TOKEN}@github.com/${GITHUB_REPO}.git" "HEAD:test"
