stages:
  - read-hash
  - update-test-branch

read-commit-hash:
  stage: read-hash
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "COMMIT_HASH=${CI_COMMIT_SHORT_SHA}" > hash.env
  artifacts:
    reports:
      dotenv: hash.env

update-test-branch:
  stage: update-test-branch
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  before_script:
    - apk add --no-cache git
    - git config --global user.name "gitlab-ci"
    - git config --global user.email "gitlab-ci@local"
  script:
    - git clone "https://x-access-token:${GITHUB_PUSH_TOKEN}@github.com/${GITHUB_REPO}.git" repo
    - cd repo
    - git checkout test || git checkout -b test
    - echo "tag:${COMMIT_HASH}" > testfile
    - git add testfile
    - git commit -m "update tag to ${COMMIT_HASH}" || echo "변경사항 없음, 커밋 건너뜀"
    - git push origin test
